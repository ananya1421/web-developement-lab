<!DOCTYPE html>
<html>
<head>
<style>
body { font-family:Arial; margin:20px; }
.cards { display:flex; gap:12px; overflow-x:auto; padding:10px; }
.card { flex:0 0 180px; border:1px solid #ccc; border-radius:8px;
        overflow:hidden; box-shadow:0 2px 6px #bbb; }
.card img { width:100%; height:110px; object-fit:cover; }
.card h3,.card p { margin:10px; }
.card p { font-size:13px; }
</style>
</head>
<body>
<div class="cards" id="cards"></div>
<script>
const box = document.getElementById('cards');
for (let i=1; i<=10; i++) {
  box.innerHTML += `<div class="card">
    <img src="https://picsum.photos/seed/${i}/300/180" alt="Card image">
    <h3>Card ${i}</h3><p>This is the description for card ${i}.</p>
  </div>`;
}
</script>
</body>
</html>

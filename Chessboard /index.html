<!DOCTYPE html>
<html><head><style>
#board{display:grid;grid-template-columns:repeat(8,55px);width:440px}
.cell{width:55px;height:55px;display:grid;place-items:center;font-size:30px}
</style></head><body><h2>Chessboard</h2><div id="board"></div>
<script>
const board=document.getElementById('board');
const pieces=[
 '♜','♞','♝','♛','♚','♝','♞','♜',
 '♟','♟','♟','♟','♟','♟','♟','♟',
 '', '', '', '', '', '', '', '',
 '', '', '', '', '', '', '', '',
 '', '', '', '', '', '', '', '',
 '', '', '', '', '', '', '', '',
 '♙','♙','♙','♙','♙','♙','♙','♙',
 '♖','♘','♗','♕','♔','♗','♘','♖'
];
for(let r=0;r<8;r++) for(let c=0;c<8;c++){
 const cell=document.createElement('div');
 cell.className='cell';
 cell.style.background=(r+c)%2===0?'#f0d9b5':'#8b5a2b';
 cell.textContent=pieces[r*8+c];
 board.appendChild(cell);
}
</script></body></html>

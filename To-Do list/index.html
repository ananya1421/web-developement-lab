<!DOCTYPE html>
<html><head><style>
body{font-family:Arial;max-width:600px;margin:30px auto}
li{margin:10px 0;padding:8px;background:#eee}
.done{text-decoration:line-through;color:gray}
button{margin-left:5px}
</style></head><body>
<h2>My To-Do List</h2>
<input id="task" placeholder="Enter a task">
<button onclick="addTask()">Add</button>
<ul id="list"></ul>
<script>
function addTask(){
 const input=document.getElementById('task');
 if(!input.value.trim()) return;
 const li=document.createElement('li');
 const check=document.createElement('input'); check.type='checkbox';
 check.onchange=()=>text.classList.toggle('done',check.checked);
 const text=document.createElement('span'); text.textContent=input.value+' ';
 const del=document.createElement('button'); del.textContent='Delete';
 del.onclick=()=>li.remove();
 const up=document.createElement('button'); up.textContent='Up';
 up.onclick=()=>{if(li.previousElementSibling) li.parentNode.insertBefore(li,li.previousElementSibling);};
 const down=document.createElement('button'); down.textContent='Down';
 down.onclick=()=>{if(li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling,li);};
 li.append(check,text,del,up,down);
 document.getElementById('list').appendChild(li); input.value='';
}
</script></body></html>
